<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b29"><title>BarDeli Club</title><link rel="stylesheet" href="style.css"></head><body><header><div><small>BARDELI CLUB</small><h1>Управління змінами</h1></div><span class="badge">ДЕМО 1.0</span></header><main><nav><button id="staffTab" class="active">👤 Працівник</button><button id="adminTab">🗂️ Адміністратор</button></nav><section class="card"><label for="employee">Працівник</label><select id="employee"></select><p class="muted">Дані зберігаються лише в цьому браузері. Це тестова версія без спільної бази даних.</p></section><div id="staff"><section class="card"><h2>Моя зміна</h2><div id="status"></div><div class="actions"><button id="clockIn" class="primary">▶ Відкрити зміну</button><button id="clockOut" class="danger">■ Закрити зміну</button></div><p id="elapsed" class="muted"></p></section><section class="card"><div class="row"><h2>Мій календар</h2><div class="row"><button id="prevWeek">‹</button><button id="nextWeek">›</button></div></div><p id="weekLabel" class="muted"></p><div id="calendar" class="calendar"></div><p class="legend">🟦 Заплановано &nbsp; 🟩 Відпрацьовано</p></section><section class="card"><h2>Мій підсумок</h2><div id="totals"></div></section></div><div id="admin" hidden><section class="card"><h2>Запланувати зміну</h2><label for="shiftDate">Дата</label><input id="shiftDate" type="date"><div class="two"><div><label for="start">Початок</label><input id="start" type="time" value="10:00"></div><div><label for="end">Кінець</label><input id="end" type="time" value="18:00"></div></div><button id="addShift" class="primary full">+ Додати зміну</button><p id="formError" role="alert"></p></section><section class="card"><h2>Працівники та ставки</h2><div id="rates"></div><div class="two"><input id="newName" placeholder="Ім’я працівника" maxlength="40"><button id="addEmployee">Додати</button></div></section><section class="card"><h2>Усі зміни</h2><div id="allShifts"></div></section></div></main><script src="app.js"></script></body></html>
